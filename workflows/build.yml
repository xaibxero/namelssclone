name: Build NamelessClone APK & Zygisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Gradle Project Files
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "namelssclone"
          include(":app")
          EOF
          fi

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          fi

      - name: Build Zygisk C++ Module
        run: |
          cd module_zygisk
          NDK_DIR=
          if [ -z "" ]; then
            echo "[-] NDK not found in standard path, checking ANDROID_NDK_ROOT"
            NDK_DIR=""
          fi
          echo "[+] Using NDK: "
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/build/cmake/android.toolchain.cmake                 -DANDROID_ABI=arm64-v8a                 -DANDROID_PLATFORM=android-29 ..
          make
          cd ..
          mkdir -p module_out/zygisk
          cp build/libnamelssclone.so module_out/zygisk/arm64-v8a.so
          cp module.prop module_out/
          cd module_out && zip -r ../../namelssclone_zygisk_module.zip ./* && cd ../..

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Manager APK
        run: |
          gradle assembleDebug

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: NamelessClone-Manager-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Zygisk Flashable Module
        uses: actions/upload-artifact@v4
        with:
          name: NamelessClone-Zygisk-Module
          path: namelssclone_zygisk_module.zip
